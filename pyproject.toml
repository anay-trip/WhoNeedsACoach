[project]
name = "whoneedsacoach"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.2.0",
    "fastapi>=0.115.0",
    "garminconnect==0.3.2",
    "openai-agents>=0.23.1",
    "pyjwt>=2.9.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
coach = "whoneedsacoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["httpx>=0.27.0", "pytest", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
