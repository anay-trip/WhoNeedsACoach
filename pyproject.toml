[project]
name = "whoneedsacoach"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "garminconnect==0.3.2",
    "openai-agents>=0.23.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
coach = "whoneedsacoach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
